{% extends "base.html" %}
{% block title %} — Settings{% endblock %}
{% block content %}

<div class="page-header">
  <h2>Settings</h2>
  <p class="page-subtitle">Robot identity, connection, and appearance</p>
</div>

<section class="card card-settings">

  <form id="settingsForm" class="settings-form">

    <div class="form-group">
      <label for="robotName">Robot Name</label>
      <input type="text" id="robotName" name="robotName" value="JARVIS-01" placeholder="Robot name">
    </div>

    <div class="form-group">
      <label for="robotIp">Connection IP</label>
      <input type="text" id="robotIp" name="robotIp" value="192.168.1.42" placeholder="e.g. 192.168.1.42">
    </div>

    <div class="form-group">
      <label for="robotPort">Connection Port</label>
      <input type="text" id="robotPort" name="robotPort" value="5000" placeholder="e.g. 5000">
    </div>

 

    <button type="submit" class="btn btn-primary" id="saveSettingsBtn">Save Settings</button>
    <div class="settings-saved-msg" id="settingsSavedMsg"></div>

  </form>

</section>

{% endblock %}
